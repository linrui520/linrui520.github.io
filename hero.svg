<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-labelledby="title desc">
<title id="title">一台正在等待输入的复古 Mac</title>
<desc id="desc">米白色的经典桌上电脑、机械键盘和单键鼠标，用黑色线条和网点绘制。</desc>
<style>
@media(prefers-reduced-motion:no-preference){
 .crt-glow{animation:crt-wake 1s ease-out .25s both}
 .crt-prompt{animation:crt-type .7s ease-out .5s both;stroke-dasharray:32;stroke-dashoffset:0}
 .crt-cursor{animation:cursor-blink 1s step-end 1.15s 3}
}
@keyframes crt-wake{from{opacity:.08}to{opacity:1}}
@keyframes crt-type{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}
@keyframes cursor-blink{50%{opacity:0}}
</style>
